<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f766e">
<title>Scanner</title>
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>
<style>
  :root{
    --bg:#f4f6f6; --card:#fff; --ink:#14201f; --muted:#5f6d6b; --line:#dde3e2;
    --brand:#0f766e; --brand-ink:#fff; --danger:#b42318; --ok:#16794a; --warn:#a15c07;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--ink);
    font:16px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
    -webkit-tap-highlight-color:transparent}
  header{position:sticky;top:0;z-index:5;background:var(--brand);color:var(--brand-ink);
    padding:calc(10px + env(safe-area-inset-top)) 14px 10px}
  .row{display:flex;gap:8px;align-items:center}
  .grow{flex:1;min-width:0}
  header select{width:100%;font-size:17px;font-weight:600;padding:8px 10px;border-radius:10px;border:0;
    background:rgba(255,255,255,.15);color:#fff;appearance:none;-webkit-appearance:none}
  header select option{color:#000}
  .hbtn{background:rgba(255,255,255,.15);color:#fff;border:0;border-radius:10px;padding:8px 11px;font-size:15px}
  #status{margin-top:6px;font-size:13px;opacity:.95;display:flex;align-items:center;gap:6px}
  #status .dot{width:8px;height:8px;border-radius:50%;background:#cbd5d4;flex:none}
  main{padding:14px 14px 190px;max-width:640px;margin:0 auto}
  .scanbtn{display:block;width:100%;border:0;border-radius:16px;background:var(--brand);color:#fff;
    font-size:22px;font-weight:700;padding:22px 10px;box-shadow:0 4px 14px rgba(15,118,110,.3)}
  .manual{margin-top:12px}
  .manual input{width:100%;font-size:17px;padding:12px;border:1px solid var(--line);border-radius:12px;background:#fff}
  .btn{border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:12px;padding:12px 14px;font-size:16px;font-weight:600}
  .btn.primary{background:var(--brand);border-color:var(--brand);color:#fff}
  .summary{margin:18px 2px 8px;color:var(--muted);font-size:14px;display:flex;justify-content:space-between}
  ul{list-style:none;margin:0;padding:0}
  li.item{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 12px;margin-bottom:8px;
    display:flex;gap:10px;align-items:center}
  li.item.flash{animation:flash 1s}
  @keyframes flash{from{background:#d7f3ee}to{background:var(--card)}}
  .code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:16px;font-weight:600;word-break:break-all}
  .meta{font-size:12px;color:var(--muted);margin-top:2px}
  .note{font-size:13px;color:var(--ink);margin-top:3px}
  .qty{display:flex;align-items:center;gap:4px}
  .qty button{width:34px;height:34px;border-radius:10px;border:1px solid var(--line);background:#fff;font-size:19px;line-height:1}
  .qty span{min-width:28px;text-align:center;font-weight:700;font-size:17px}
  .more{border:0;background:none;font-size:20px;color:var(--muted);padding:4px 6px}
  .empty{text-align:center;color:var(--muted);padding:30px 10px}
  footer{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);
    padding:10px 14px calc(10px + env(safe-area-inset-bottom));z-index:5}
  footer .inner{max-width:640px;margin:0 auto}
  footer .btn{flex:1;padding:12px 6px;font-size:15px}
  footer .btn.primary{font-size:17px;padding:14px 6px}
  #scanView{position:fixed;inset:0;background:#000;z-index:20;display:flex;flex-direction:column}
  #scanView[hidden]{display:none}
  #reader{flex:1;width:100%;overflow:hidden}
  #reader video{object-fit:cover}
  .scanbar{background:#111;color:#fff;padding:12px 14px calc(14px + env(safe-area-inset-bottom))}
  #scanMsg{min-height:44px;font-size:17px;margin-bottom:10px;word-break:break-all}
  #scanMsg.ok{color:#6ee7b7;font-weight:700}
  .scanbar .btn{flex:1}
  #toast{position:fixed;left:50%;bottom:170px;transform:translateX(-50%);background:#14201f;color:#fff;
    padding:10px 16px;border-radius:12px;font-size:15px;opacity:0;transition:opacity .2s;z-index:30;
    pointer-events:none;max-width:90vw;text-align:center}
  #toast.show{opacity:1}
  .setup{background:#fff7e6;border:1px solid #f3d49b;color:#6b4200;border-radius:12px;padding:10px 12px;font-size:14px;margin-bottom:12px}
  .hidden{display:none}
</style>
</head>
<body>

<header>
  <div class="row">
    <div class="grow"><select id="listSel" aria-label="Current list"></select></div>
    <button class="hbtn" id="newList" aria-label="New list">＋ New</button>
    <button class="hbtn" id="listMenu" aria-label="List options">⋯</button>
  </div>
  <div id="status"><span class="dot"></span><span id="statusText"></span></div>
</header>

<main>
  <div id="setupNote" class="setup hidden">Online saving isn't set up yet. Scans are kept on this phone only. (Owner: paste your Google Sheet link into <b>SHEET_URL</b> in index.html.)</div>

  <button class="scanbtn" id="scanBtn">📷 Scan</button>

  <form class="manual row" id="manualForm" autocomplete="off">
    <input class="grow" id="manualInput" inputmode="text" placeholder="Or type a barcode…" enterkeyhint="done">
    <button class="btn" type="submit">Add</button>
  </form>

  <div class="summary"><span id="countText"></span><span id="totalText"></span></div>
  <ul id="items"></ul>
</main>

<footer>
  <div class="inner">
    <div class="row" style="margin-bottom:8px">
      <button class="btn primary" id="shareBtn" style="flex:1">Send Excel (WhatsApp / Mail…)</button>
    </div>
    <div class="row">
      <button class="btn" id="waBtn">WhatsApp text</button>
      <button class="btn" id="mailBtn">Email text</button>
      <button class="btn" id="dlBtn">Download</button>
    </div>
  </div>
</footer>

<div id="scanView" hidden>
  <div id="reader"></div>
  <div class="scanbar">
    <div id="scanMsg">Point the camera at a barcode</div>
    <div class="row">
      <label class="btn" style="text-align:center">📸 Take photo
        <input id="photoInput" type="file" accept="image/*" capture="environment" hidden>
      </label>
      <button class="btn primary" id="doneBtn">Done</button>
    </div>
  </div>
</div>
<div id="fileReader" style="display:none"></div>
<div id="toast"></div>

<script>
/* ================= SETTINGS (owner edits this) ================= */
const CONFIG = {
  // Paste the Web app URL from Google Apps Script (ends with /exec):
  SHEET_URL: "",
};
/* =============================================================== */

const KEY = "scanner.v1";
const $ = s => document.querySelector(s);
const uid = () => (crypto.randomUUID ? crypto.randomUUID()
  : Date.now().toString(36) + Math.random().toString(36).slice(2));

function newListObj(name){ return { id: uid(), name, created: new Date().toISOString(), items: [] }; }
function defaultListName(){
  const d = new Date();
  return d.toLocaleDateString() + " " + d.toLocaleTimeString([], {hour:"2-digit", minute:"2-digit"});
}
function load(){
  try{
    const s = JSON.parse(localStorage.getItem(KEY));
    if (s && Array.isArray(s.lists) && s.lists.length) { s.deleted = s.deleted || []; return s; }
  }catch(e){}
  const l = newListObj(defaultListName());
  return { device: uid().slice(0,8), name: "", lists: [l], current: l.id, deleted: [] };
}
let state = load();
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(state)); }catch(e){ toast("Phone storage is full"); } }
function cur(){ return state.lists.find(l => l.id === state.current) || state.lists[0]; }
function touch(it){ it.v = (it.v || 0) + 1; it.updatedAt = new Date().toISOString(); }

/* ---------- items ---------- */
let flashId = null;
function addCode(raw, format){
  const code = String(raw).trim();
  if (!code) return null;
  const list = cur();
  const idx = list.items.findIndex(i => i.code === code);
  let it;
  if (idx >= 0){
    it = list.items.splice(idx, 1)[0];
    it.qty++; touch(it);
  } else {
    it = { id: uid(), code, format: format || "Manual", qty: 1, note: "",
           scannedAt: new Date().toISOString(), v: 1, sv: 0 };
  }
  list.items.unshift(it);
  flashId = it.id;
  save(); render(); scheduleSync();
  return it;
}
function setQty(it, q){
  if (q < 1){ removeItem(it); return; }
  it.qty = q; touch(it); save(); render(); scheduleSync();
}
function removeItem(it){
  if (!confirm(`Remove ${it.code}?`)) return;
  const list = cur();
  list.items = list.items.filter(i => i !== it);
  state.deleted.push(it.id);
  save(); render(); scheduleSync();
}
function itemMenu(it){
  const n = prompt(`Note for ${it.code} (leave empty to clear).\nType DELETE to remove it.`, it.note || "");
  if (n === null) return;
  if (n.trim().toUpperCase() === "DELETE"){ removeItem(it); return; }
  it.note = n.trim(); touch(it); save(); render(); scheduleSync();
}

/* ---------- render ---------- */
function render(){
  const sel = $("#listSel");
  sel.innerHTML = "";
  state.lists.forEach(l => {
    const o = document.createElement("option");
    o.value = l.id; o.textContent = l.name; if (l.id === state.current) o.selected = true;
    sel.appendChild(o);
  });
  const list = cur();
  const ul = $("#items");
  ul.innerHTML = "";
  if (!list.items.length){
    const e = document.createElement("li"); e.className = "empty";
    e.textContent = "No barcodes yet. Tap Scan to start.";
    ul.appendChild(e);
  }
  list.items.forEach(it => {
    const li = document.createElement("li");
    li.className = "item" + (it.id === flashId ? " flash" : "");
    const info = document.createElement("div"); info.className = "grow";
    const c = document.createElement("div"); c.className = "code"; c.textContent = it.code;
    const m = document.createElement("div"); m.className = "meta";
    m.textContent = new Date(it.scannedAt).toLocaleTimeString([], {hour:"2-digit",minute:"2-digit"})
      + " · " + (it.format || "") + (it.v !== it.sv && CONFIG.SHEET_URL ? " · waiting to save" : "");
    info.append(c, m);
    if (it.note){ const n = document.createElement("div"); n.className = "note"; n.textContent = "📝 " + it.note; info.appendChild(n); }
    const q = document.createElement("div"); q.className = "qty";
    const minus = document.createElement("button"); minus.textContent = "−"; minus.onclick = () => setQty(it, it.qty - 1);
    const val = document.createElement("span"); val.textContent = it.qty;
    const plus = document.createElement("button"); plus.textContent = "+"; plus.onclick = () => setQty(it, it.qty + 1);
    q.append(minus, val, plus);
    const more = document.createElement("button"); more.className = "more"; more.textContent = "✎";
    more.setAttribute("aria-label", "Note or delete"); more.onclick = () => itemMenu(it);
    li.append(info, q, more);
    ul.appendChild(li);
  });
  flashId = null;
  const total = list.items.reduce((s, i) => s + i.qty, 0);
  $("#countText").textContent = `${list.items.length} barcode${list.items.length === 1 ? "" : "s"}`;
  $("#totalText").textContent = `Total qty: ${total}`;
  $("#setupNote").classList.toggle("hidden", !!CONFIG.SHEET_URL);
  updateStatus();
}

/* ---------- lists ---------- */
$("#listSel").onchange = e => { state.current = e.target.value; save(); render(); };
$("#newList").onclick = () => {
  const name = prompt("Name for the new list:", defaultListName());
  if (name === null) return;
  const l = newListObj(name.trim() || defaultListName());
  state.lists.unshift(l); state.current = l.id; save(); render();
};
$("#listMenu").onclick = () => {
  const list = cur();
  const choice = prompt(
    `List: ${list.name}\n\n1 = Rename list\n2 = Delete list\n3 = Set your name (shown in the sheet)` +
    (state.name ? ` – now "${state.name}"` : ""), "");
  if (choice === "1"){
    const n = prompt("New name:", list.name);
    if (n && n.trim()){ list.name = n.trim(); list.items.forEach(touch); save(); render(); scheduleSync(); }
  } else if (choice === "2"){
    if (!confirm(`Delete "${list.name}" and its ${list.items.length} barcodes?`)) return;
    list.items.forEach(i => state.deleted.push(i.id));
    state.lists = state.lists.filter(l => l !== list);
    if (!state.lists.length) state.lists.push(newListObj(defaultListName()));
    state.current = state.lists[0].id; save(); render(); scheduleSync();
  } else if (choice === "3"){
    const n = prompt("Your name:", state.name || "");
    if (n !== null){ state.name = n.trim(); state.lists.forEach(l => l.items.forEach(touch)); save(); render(); scheduleSync(); }
  }
};

/* ---------- manual entry ---------- */
$("#manualForm").onsubmit = e => {
  e.preventDefault();
  const inp = $("#manualInput");
  if (addCode(inp.value, "Manual")){ toast("Added"); inp.value = ""; }
};

/* ---------- scanner ---------- */
let scanner = null, lastCode = "", lastTime = 0, audioCtx = null;
function beep(){
  try{
    audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
    const o = audioCtx.createOscillator(), g = audioCtx.createGain();
    o.frequency.value = 1100; g.gain.value = 0.15;
    o.connect(g); g.connect(audioCtx.destination);
    o.start(); o.stop(audioCtx.currentTime + 0.09);
  }catch(e){}
}
function formats(){
  const F = Html5QrcodeSupportedFormats;
  return [F.EAN_13, F.EAN_8, F.UPC_A, F.UPC_E, F.CODE_128, F.CODE_39, F.CODE_93,
          F.ITF, F.CODABAR, F.QR_CODE, F.DATA_MATRIX];
}
function onScan(text, result){
  const now = Date.now();
  if (text === lastCode && now - lastTime < 2000) return; // avoid double-reading the same label
  lastCode = text; lastTime = now;
  let fmt = "";
  try{ fmt = result.result.format.formatName; }catch(e){}
  const it = addCode(text, fmt);
  beep(); if (navigator.vibrate) navigator.vibrate(80);
  const msg = $("#scanMsg");
  msg.className = "ok";
  msg.textContent = `✓ ${text}   (qty ${it.qty})`;
}
$("#scanBtn").onclick = async () => {
  try{ audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)(); audioCtx.resume(); }catch(e){}
  $("#scanView").hidden = false;
  const msg = $("#scanMsg"); msg.className = ""; msg.textContent = "Point the camera at a barcode";
  if (typeof Html5Qrcode === "undefined"){ msg.textContent = "Scanner didn't load – check your internet, or type the code."; return; }
  scanner = new Html5Qrcode("reader", { verbose:false, formatsToSupport: formats(),
    experimentalFeatures: { useBarCodeDetectorIfSupported: true } });
  try{
    await scanner.start({ facingMode: "environment" },
      { fps: 12, qrbox: (w, h) => ({ width: Math.max(60, Math.floor(w * 0.85)),
                                     height: Math.max(60, Math.floor(Math.min(h * 0.45, w * 0.6))) }) },
      onScan, () => {});
  }catch(e){
    msg.textContent = "Camera not available (" + (e && e.message ? e.message : e) +
      "). Use “Take photo”, or close and type the code.";
  }
};
async function closeScanner(){
  if (scanner){
    try{ if (scanner.isScanning) await scanner.stop(); scanner.clear(); }catch(e){}
    scanner = null;
  }
  $("#scanView").hidden = true;
}
$("#doneBtn").onclick = closeScanner;
$("#photoInput").onchange = async e => {
  const f = e.target.files && e.target.files[0];
  e.target.value = "";
  if (!f) return;
  const msg = $("#scanMsg");
  const tmp = new Html5Qrcode("fileReader", { verbose:false, formatsToSupport: formats() });
  try{
    const text = await tmp.scanFile(f, false);
    onScan(text, null);
  }catch(err){
    msg.className = ""; msg.textContent = "No barcode found in the photo – try closer, with good light.";
  }finally{ try{ tmp.clear(); }catch(e){} }
};

/* ---------- online save to Google Sheet ---------- */
let syncing = false, syncTimer = null, lastError = "";
function pending(){
  let n = 0;
  state.lists.forEach(l => l.items.forEach(i => { if (i.v !== i.sv) n++; }));
  return n + state.deleted.length;
}
function scheduleSync(delay = 800){
  clearTimeout(syncTimer);
  syncTimer = setTimeout(sync, delay);
  updateStatus();
}
async function sync(){
  if (!CONFIG.SHEET_URL || syncing || !navigator.onLine){ updateStatus(); return; }
  const rows = [], snap = [];
  state.lists.forEach(l => l.items.forEach(i => {
    if (i.v !== i.sv){
      rows.push({ id:i.id, list:l.name, code:i.code, format:i.format, qty:i.qty, note:i.note, scannedAt:i.scannedAt });
      snap.push([i, i.v]);
    }
  }));
  const deleted = state.deleted.slice();
  if (!rows.length && !deleted.length){ updateStatus(); return; }
  syncing = true; updateStatus();
  let ok = false;
  try{
    // No custom headers -> simple request, which Google Apps Script accepts from any website.
    const res = await fetch(CONFIG.SHEET_URL, { method: "POST",
      body: JSON.stringify({ device: state.device, name: state.name, rows, deleted }) });
    const j = await res.json();
    if (!j.ok) throw new Error(j.error || "Sheet error");
    snap.forEach(([i, v]) => { i.sv = v; });
    state.deleted = state.deleted.filter(id => !deleted.includes(id));
    save(); lastError = ""; ok = true;
  }catch(e){
    lastError = e.message || String(e);
  }finally{
    syncing = false;
    render();
    if (pending()) scheduleSync(ok ? 500 : 15000);
  }
}
function updateStatus(){
  const dot = $("#status .dot"), t = $("#statusText"), n = pending();
  let color = "#cbd5d4", text;
  if (!CONFIG.SHEET_URL){ text = "Saved on this phone only"; }
  else if (!navigator.onLine){ color = "#fbbf24"; text = `Offline – ${n} waiting, will save when back online`; }
  else if (syncing){ color = "#93c5fd"; text = "Saving to sheet…"; }
  else if (lastError && n){ color = "#fca5a5"; text = `Couldn't save (${n} waiting) – retrying`; }
  else if (n){ color = "#fbbf24"; text = `${n} waiting to save…`; }
  else { color = "#86efac"; text = "All saved to sheet ✓"; }
  dot.style.background = color; t.textContent = text;
}
window.addEventListener("online", () => scheduleSync(0));
window.addEventListener("offline", updateStatus);
setInterval(() => { if (pending()) sync(); }, 30000);

/* ---------- export ---------- */
function safeName(s){ return (s || "scans").replace(/[\\/:*?"<>|]+/g, "-").slice(0, 60); }
function buildXlsx(list){
  const rows = [["Barcode", "Qty", "Note", "Scanned at", "Format"]];
  list.items.slice().reverse().forEach(i =>
    rows.push([String(i.code), i.qty, i.note || "", new Date(i.scannedAt).toLocaleString(), i.format || ""]));
  const ws = XLSX.utils.aoa_to_sheet(rows);
  ws["!cols"] = [{wch:20},{wch:6},{wch:28},{wch:20},{wch:12}];
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, "Scans");
  const buf = XLSX.write(wb, { bookType: "xlsx", type: "array" });
  return new File([buf], safeName(list.name) + ".xlsx",
    { type: "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" });
}
function download(file){
  const a = document.createElement("a");
  a.href = URL.createObjectURL(file); a.download = file.name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 5000);
}
function checkList(){
  const list = cur();
  if (!list.items.length){ toast("This list is empty"); return null; }
  if (typeof XLSX === "undefined"){ toast("Excel tool didn't load – check internet"); return null; }
  return list;
}
function asText(list){
  const lines = list.items.slice().reverse().map(i => `${i.code}  ×${i.qty}${i.note ? "  (" + i.note + ")" : ""}`);
  const total = list.items.reduce((s, i) => s + i.qty, 0);
  return `${list.name}\n${list.items.length} barcodes, total qty ${total}\n\n${lines.join("\n")}`;
}
$("#shareBtn").onclick = async () => {
  const list = checkList(); if (!list) return;
  const file = buildXlsx(list);
  if (navigator.canShare && navigator.canShare({ files: [file] })){
    try{ await navigator.share({ files: [file], title: list.name }); }
    catch(e){ if (e.name !== "AbortError"){ download(file); toast("Downloaded – attach it to your message"); } }
  } else {
    download(file);
    toast("Excel downloaded – attach it in Mail or WhatsApp");
  }
};
$("#dlBtn").onclick = () => { const list = checkList(); if (list) download(buildXlsx(list)); };
$("#waBtn").onclick = () => {
  const list = cur(); if (!list.items.length) return toast("This list is empty");
  location.href = "https://wa.me/?text=" + encodeURIComponent(asText(list));
};
$("#mailBtn").onclick = () => {
  const list = cur(); if (!list.items.length) return toast("This list is empty");
  location.href = "mailto:?subject=" + encodeURIComponent("Scans: " + list.name) +
                  "&body=" + encodeURIComponent(asText(list));
};

/* ---------- misc ---------- */
let toastTimer;
function toast(msg){
  const t = $("#toast"); t.textContent = msg; t.classList.add("show");
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove("show"), 2200);
}

render();
scheduleSync(300);
</script>
</body>
</html>
